# .github/workflows/build-and-scan.yml
name: "Wiz CLI v1.x: Build, Scan, Push, and Tag"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ECR_REGISTRY: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com # <-- UPDATE THIS
  ECR_REPOSITORY: phoebe-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-scan-and-push:
    name: "Wiz CLI v1.x Workflow"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/YourGitHubActionRole # <-- UPDATE THIS
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # Step 1: Download the v1 binary (Updated URL)
      - name: Download Wiz CLI v1
        run: |
          curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli

      # Step 2: Scan the image (v1 Auto-Auth & New Syntax)
      - name: Run Wiz CLI v1 Scan
        run: |
          ./wizcli scan container-image "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" \
            --project "<PROJECT-ID>" \
            --tags "repo=${{ github.repository }},branch=${{ github.ref_name }},commit=${{ github.sha }}" \
            --json-output-file "wiz-results.json" \
            --by-policy-hits BLOCK \
            --log "wiz-scan.log"
        env:
          # v1 automatically authenticates using these variables
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

      # Step 3: Tag the image in Wiz (v1 Syntax)
      - name: Tag Scanned Image in Wiz
        if: success()
        run: |
          ./wizcli tag container-image "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" \
            --digest "${{ steps.build-and-push.outputs.digest }}"
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Upload Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiz-scan-artifacts
          path: |
            wiz-results.json
            wiz-scan.log
